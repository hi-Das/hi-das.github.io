<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manyabar Das | Portfolio</title>
    <meta name="description" content="Personal portfolio and resume site.">
    <meta name="theme-color" content="#ffffff">
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f7f7f5;
            --surface-2: #f1f1ef;
            --text: #191919;
            --muted: #6b6b69;
            --line: #e9e9e6;
            --line-strong: #dcdcd8;
            --max: 760px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            letter-spacing: 0.01em;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            max-width: var(--max);
            margin: 0 auto;
            padding: 52px 24px 72px;
        }

        .header {
            display: grid;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--line);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 18px;
        }

        .identity {
            min-width: 0;
        }

        .name {
            margin: 0;
            font-size: clamp(1.56rem, 3.8vw, 2rem);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.03em;
        }

        .focus {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .contact-strip {
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface);
            padding: 8px 10px;
        }

        .contact-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-wrap: nowrap;
            gap: 6px 14px;
            white-space: nowrap;
        }

        .contact-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: #3a3a38;
            white-space: nowrap;
        }

        .contact-icon {
            color: #4b4b47;
            width: 16px;
            height: 16px;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }

        .contact-icon svg {
            width: 14px;
            height: 14px;
            display: block;
            fill: currentColor;
        }

        .contact-value {
            user-select: text;
        }

        .tabs-wrap {
            position: sticky;
            top: 0;
            z-index: 10;
            margin-top: 16px;
            padding: 5px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(247, 247, 245, 0.95);
            backdrop-filter: blur(6px);
        }

        .tabs {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        .tab {
            appearance: none;
            border: 0;
            padding: 7px 12px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.87rem;
            cursor: pointer;
            border-radius: 8px;
            transition: color 160ms ease, background 160ms ease;
        }

        .tab:hover,
        .tab:focus-visible {
            color: var(--text);
            background: #f3f2ef;
            outline: none;
        }

        .tab.is-active {
            color: var(--text);
            background: #efede8;
        }

        .content {
            padding-top: 26px;
            min-height: 360px;
        }

        .tab-panel {
            display: none;
            animation: fadeIn 220ms ease;
        }

        .tab-panel.is-active {
            display: block;
        }

        .intro {
            margin: 0;
            color: #2a2a29;
            font-size: 0.98rem;
            line-height: 1.7;
        }

        .story {
            margin-top: 0;
        }

        .story-title {
            margin: 0;
            font-size: 0.84rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .story-paragraph {
            margin: 10px 0 0;
            color: #2a2a29;
            font-size: 0.92rem;
            line-height: 1.7;
        }

        .story-lead {
            margin: 10px 0 0;
            color: var(--text);
            font-size: 0.98rem;
            font-weight: 500;
            line-height: 1.72;
        }

        .story-principles {
            list-style: none;
            padding: 0;
            margin: 12px 0 0;
            display: grid;
            gap: 8px;
        }

        .story-principle {
            padding: 9px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            color: #2f2f2d;
            font-size: 0.88rem;
            line-height: 1.6;
        }

        .story-target-copy {
            margin: 8px 0 0;
            color: #3a3a38;
            font-size: 0.9rem;
            line-height: 1.65;
        }

        .cert-list {
            list-style: none;
            margin: 10px 0 0;
            padding: 0;
            display: grid;
            gap: 8px;
        }

        .cert-item {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
            padding: 9px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
        }

        .cert-name {
            margin: 0;
            font-size: 0.88rem;
            color: #2f2f2d;
        }

        .cert-meta {
            margin: 0;
            font-size: 0.8rem;
            color: var(--muted);
            white-space: nowrap;
        }

        .callout {
            margin-top: 18px;
            display: grid;
            grid-template-columns: 28px 1fr;
            gap: 12px;
            padding: 14px 14px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
        }

        .callout-emoji {
            font-size: 1.1rem;
            line-height: 1.2;
            margin-top: 1px;
        }

        .callout-title {
            margin: 0;
            font-size: 0.84rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .badge-list {
            list-style: none;
            padding: 0;
            margin: 8px 0 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 0 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface-2);
            font-size: 0.84rem;
            color: #3a3a38;
        }

        .timeline {
            display: grid;
            gap: 0;
        }

        .exp-summary {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.84rem;
        }

        .role {
            padding: 16px 0;
            border-top: 1px solid var(--line);
        }

        .role:last-child { padding-bottom: 0; }

        .role-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 14px;
        }

        .role-main {
            min-width: 0;
        }

        .role-title {
            margin: 0;
            font-size: 0.98rem;
            font-weight: 650;
            letter-spacing: -0.01em;
        }

        .role-company {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 0.84rem;
            line-height: 1.5;
        }

        .role-dates {
            display: inline-flex;
            align-items: center;
            min-height: 26px;
            padding: 0 9px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface-2);
            color: #4d4d4a;
            font-size: 0.78rem;
            white-space: nowrap;
        }

        .role-bullets {
            margin: 10px 0 0;
            padding-left: 18px;
            color: var(--muted);
            display: grid;
            gap: 5px;
            line-height: 1.45;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .project {
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            padding: 12px 12px 13px;
            transition: border-color 160ms ease, background 160ms ease;
        }

        .project:hover {
            border-color: var(--line-strong);
            background: var(--surface);
        }

        .project-title {
            margin: 0;
            font-size: 0.94rem;
            font-weight: 650;
            letter-spacing: -0.01em;
        }

        .project-desc {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 0.88rem;
        }

        .project-value {
            margin: 8px 0 0;
            color: #333330;
            font-size: 0.84rem;
            line-height: 1.55;
        }

        .project-stack {
            margin: 10px 0 0;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .project-link {
            display: inline-block;
            margin-top: 10px;
            color: #3b3b38;
            font-size: 0.82rem;
            border-bottom: 1px solid var(--line-strong);
            padding-bottom: 1px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(3px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 760px) {
            .header {
                gap: 10px;
            }

            .header-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .tabs-wrap {
                width: 100%;
            }

            .tabs {
                width: 100%;
            }

            .contact-strip {
                width: 100%;
                overflow-x: auto;
            }

            .contact-list {
                gap: 6px 12px;
            }

            .projects {
                grid-template-columns: 1fr;
            }

            .role-head {
                flex-direction: column;
                gap: 3px;
                align-items: flex-start;
            }

            .role-dates {
                white-space: normal;
            }

            .callout {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }
    </style>
</head>

                    : "",
                contact.timezones
                    ? `<li class="contact-item"><span class="contact-icon" aria-hidden="true">${icons.timezone}</span><span>${escapeHtml(contact.timezones)}</span></li>`
                    : "",
                contact.email
                    ? `<li class="contact-item"><span class="contact-icon" aria-hidden="true">${icons.email}</span><span class="contact-value">${escapeHtml(contact.email)}</span></li>`
                    : "",
                contact.linkedin
                    ? `<li class="contact-item"><span class="contact-icon" aria-hidden="true">${icons.linkedin}</span><a class="contact-link" href="${escapeHtml(contact.linkedin)}" target="_blank" rel="noreferrer">${escapeHtml(linkedInLabel)}</a></li>`
                    : "",
                contact.github
                    ? `<li class="contact-item"><span class="contact-icon" aria-hidden="true">${icons.github}</span><a class="contact-link" href="${escapeHtml(contact.github)}" target="_blank" rel="noreferrer">${escapeHtml(githubLabel)}</a></li>`
                    : ""
            ].join("");

            return `
                <header class="header">
                    <div class="header-top">
                        <div class="identity">
                            <h1 class="name">${escapeHtml(data.profile.name)}</h1>
                            <p class="focus">${escapeHtml(data.profile.focus)}</p>
                        </div>
                    </div>
                    <section class="contact-strip" aria-label="Contact">
                        <ul class="contact-list">${contactRows}</ul>
                    </section>
                </header>
                <div class="tabs-wrap">
                    <nav class="tabs" role="tablist" aria-label="Portfolio sections">
                        ${tabButtons}
                    </nav>
                </div>
            `;
        }

        function renderStory(data) {
            const storyParagraphs = (data.story?.paragraphs || [])
                .map((text) => `<p class="story-paragraph">${escapeHtml(text)}</p>`)
                .join("");

            const competencyBadges = (data.story?.competencies || [])
                .map((item) => `<li class="badge">${escapeHtml(item)}</li>`)
                .join("");

            const certifications = (data.story?.certifications || [])
                .map((cert) => `
                    <li class="cert-item">
                        <p class="cert-name">${escapeHtml(cert.name)}</p>
                        <p class="cert-meta">${escapeHtml(cert.issuer)} · ${escapeHtml(cert.year)}</p>
                    </li>
                `)
                .join("");

            const storyPrinciples = (data.story?.principles || [])
                .map((item) => `<li class="story-principle">${escapeHtml(item)}</li>`)
                .join("");

            const lookingForBody = data.story?.lookingFor?.body
                ? `<p class="story-target-copy">${escapeHtml(data.story.lookingFor.body)}</p>`
                : "";

            const storySection = data.story
                ? `
                    <section class="story" aria-label="Story">
                        <p class="story-title">Path and principles</p>
                        <p class="story-lead">${escapeHtml(data.story.lead || "")}</p>
                        ${storyParagraphs}
                        <ul class="story-principles">${storyPrinciples}</ul>
                        ${data.story?.lookingFor ? `
                        <section class="callout" aria-label="What I am looking for">
                            <div class="callout-emoji" aria-hidden="true">🎯</div>
                            <div>
                                <p class="callout-title">${escapeHtml(data.story.lookingFor.title || "What I Want To Build Next")}</p>
                                ${lookingForBody}
                            </div>
                        </section>
                        ` : ""}
                        <section class="callout" aria-label="Core competencies">
                            <div class="callout-emoji" aria-hidden="true">⚙️</div>
                            <div>
                                <p class="callout-title">Core competencies</p>
                                <ul class="badge-list">${competencyBadges}</ul>
                            </div>
                        </section>
                        <section class="callout" aria-label="Certifications">
                            <div class="callout-emoji" aria-hidden="true">🎓</div>
                            <div>
                                <p class="callout-title">Certifications</p>
                                <ul class="cert-list">${certifications}</ul>
                            </div>
                        </section>
                    </section>
                `
                : "";

            return `
                <section class="tab-panel is-active" id="panel-story" role="tabpanel" aria-labelledby="tab-story">
                    ${storySection}
                </section>
            `;
        }

        function renderExperience(data) {
            const earliest = data.experience[data.experience.length - 1];
            const yearMatch = earliest?.dates?.match(/\b(\d{4})\b/);
            const startYear = yearMatch ? parseInt(yearMatch[1]) : null;
            const yearsTotal = startYear ? new Date().getFullYear() - startYear : null;
            const yearsSummary = yearsTotal
                ? `<p class="exp-summary">${yearsTotal} years of experience</p>`
                : "";

            const roles = data.experience
                .map((role) => {
                    const bullets = (role.highlights || role.bullets || [])
                        .map((point) => `<li>${escapeHtml(point)}</li>`)
                        .join("");

                    return `
                        <article class="role">
                            <div class="role-head">
                                <div class="role-main">
                                    <h3 class="role-title">${escapeHtml(role.title)}</h3>
                                    ${role.company ? `<p class="role-company">${escapeHtml(role.company)}</p>` : ""}
                                </div>
                                <span class="role-dates">${escapeHtml(role.dates)}${role.setup ? ` · ${escapeHtml(role.setup)}` : ""}</span>
                            </div>
                            <ul class="role-bullets">${bullets}</ul>
                        </article>
                    `;
                })
                .join("");

            return `
                <section class="tab-panel" id="panel-experience" role="tabpanel" aria-labelledby="tab-experience">
                    ${yearsSummary}
                    <div class="timeline">${roles}</div>
                </section>
            `;
        }

        function renderProjects(data) {
            const projectItems = data.projects
                .map((project) => {
                    const stackBadges = project.stack
                        .map((item) => `<span class="badge">${escapeHtml(item)}</span>`)
                        .join("");

                    return `
                    <article class="project">
                        <h3 class="project-title">${escapeHtml(project.title)}</h3>
                        <p class="project-desc">${escapeHtml(project.description)}</p>
                        ${project.value ? `<p class="project-value">${escapeHtml(project.value)}</p>` : ""}
                        <div class="project-stack">${stackBadges}</div>
                    </article>
                `;
                })
                .join("");

            return `
                <section class="tab-panel" id="panel-projects" role="tabpanel" aria-labelledby="tab-projects">
                    <div class="projects">${projectItems}</div>
                </section>
            `;
        }

        function renderPage(data) {
            const root = document.getElementById("app");
            root.innerHTML = `
                ${renderHeader(data)}
                <section class="content">
                    ${renderStory(data)}
                    ${renderExperience(data)}
                    ${renderProjects(data)}
                </section>
            `;
        }

        function setupTabs() {
            const tabButtons = Array.from(document.querySelectorAll(".tab"));
            const panels = Array.from(document.querySelectorAll(".tab-panel"));

            function activateTab(tabKey) {
                tabButtons.forEach((button) => {
                    const isActive = button.dataset.tab === tabKey;
                    button.classList.toggle("is-active", isActive);
                    button.setAttribute("aria-selected", isActive ? "true" : "false");
                });

                panels.forEach((panel) => {
                    const isActive = panel.id === `panel-${tabKey}`;
                    panel.classList.toggle("is-active", isActive);
                });
            }

            tabButtons.forEach((button) => {
                button.addEventListener("click", () => activateTab(button.dataset.tab));
            });
        }

        renderPage(portfolioData);
        setupTabs();
    </script>
</body>
</html>
