<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manyabar Das | Portfolio</title>
    <meta name="description" content="Personal portfolio and resume site.">
    <meta name="theme-color" content="#ffffff">
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f7f7f5;
            --surface-2: #f1f1ef;
            --text: #191919;
            --muted: #6b6b69;
            --line: #e9e9e6;
            --line-strong: #dcdcd8;
            --max: 760px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            letter-spacing: 0.01em;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            max-width: var(--max);
            margin: 0 auto;
            padding: 52px 24px 72px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 18px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--line);
        }

        .identity {
            min-width: 0;
        }

        .name {
            margin: 0;
            font-size: clamp(1.56rem, 3.8vw, 2rem);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.03em;
        }

        .focus {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .tabs-wrap {
            margin-top: 16px;
            padding: 5px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface);
        }

        .tabs {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        .tab {
            appearance: none;
            border: 0;
            padding: 7px 12px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.87rem;
            cursor: pointer;
            border-radius: 8px;
            transition: color 160ms ease, background 160ms ease;
        }

        .tab:hover,
        .tab:focus-visible {
            color: var(--text);
            background: #f3f2ef;
            outline: none;
        }

        .tab.is-active {
            color: var(--text);
            background: #efede8;
        }

        .content {
            padding-top: 26px;
            min-height: 360px;
        }

        .tab-panel {
            display: none;
            animation: fadeIn 220ms ease;
        }

        .tab-panel.is-active {
            display: block;
        }

        .panel-title {
            margin: 0 0 14px;
            font-size: 1.03rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .intro {
            margin: 0;
            color: #2a2a29;
            font-size: 0.98rem;
            line-height: 1.7;
        }

        .story {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--line);
        }

        .story-title {
            margin: 0;
            font-size: 0.84rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .story-paragraph {
            margin: 10px 0 0;
            color: #2a2a29;
            font-size: 0.92rem;
            line-height: 1.7;
        }

        .story-steps {
            list-style: none;
            margin: 12px 0 0;
            padding: 0;
            display: grid;
            gap: 10px;
        }

        .story-step-title {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 620;
            letter-spacing: -0.01em;
        }

        .story-step-text {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 0.88rem;
            line-height: 1.65;
        }

        .callout {
            margin-top: 18px;
            display: grid;
            grid-template-columns: 28px 1fr;
            gap: 12px;
            padding: 14px 14px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
        }

        .callout-emoji {
            font-size: 1.1rem;
            line-height: 1.2;
            margin-top: 1px;
        }

        .callout-title {
            margin: 0;
            font-size: 0.84rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .badge-list {
            list-style: none;
            padding: 0;
            margin: 8px 0 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 0 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface-2);
            font-size: 0.84rem;
            color: #3a3a38;
        }

        .timeline {
            display: grid;
            gap: 0;
        }

        .role {
            padding: 16px 0;
            border-top: 1px solid var(--line);
        }

        .role:last-child { padding-bottom: 0; }

        .role-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 14px;
        }

        .role-title {
            margin: 0;
            font-size: 0.98rem;
            font-weight: 650;
            letter-spacing: -0.01em;
        }

        .role-dates {
            display: inline-flex;
            align-items: center;
            min-height: 26px;
            padding: 0 9px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface-2);
            color: #4d4d4a;
            font-size: 0.78rem;
            white-space: nowrap;
        }

        .role-bullets {
            margin: 10px 0 0;
            padding-left: 18px;
            color: var(--muted);
            display: grid;
            gap: 7px;
            line-height: 1.6;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .project {
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            padding: 12px 12px 13px;
            transition: border-color 160ms ease, background 160ms ease;
        }

        .project:hover {
            border-color: var(--line-strong);
            background: var(--surface);
        }

        .project-title {
            margin: 0;
            font-size: 0.94rem;
            font-weight: 650;
            letter-spacing: -0.01em;
        }

        .project-desc {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 0.88rem;
        }

        .project-stack {
            margin: 10px 0 0;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .project-link {
            display: inline-block;
            margin-top: 10px;
            color: #3b3b38;
            font-size: 0.82rem;
            border-bottom: 1px solid var(--line-strong);
            padding-bottom: 1px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(3px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 760px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .tabs-wrap {
                width: 100%;
            }

            .tabs {
                width: 100%;
            }

            .projects {
                grid-template-columns: 1fr;
            }

            .role-head {
                flex-direction: column;
                gap: 3px;
                align-items: flex-start;
            }

            .role-dates {
                white-space: normal;
            }

            .callout {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <main class="page" id="app"></main>

    <script>
        // Edit your site content here. No HTML/CSS edits needed for normal updates.
        const portfolioData = {
            profile: {
                name: "Manyabar Das",
                focus: "Reliability / Infrastructure / DevOps"
            },
            about: {
                intro:
                    "Reliability and infrastructure engineer with 10+ years across IT support, systems administration, cloud operations, and SRE. I build and stabilize the systems behind software delivery — CI/CD, Azure infrastructure, hybrid environments, identity, and the operational guardrails that keep teams moving reliably.",
                story: {
                    paragraphs: [
                        "I care about the systems behind delivery, but also about the people who have to live with those systems every day.",
                        "I did not enter tech through a clean platform-engineering path. I started in IT support, where the work is immediate, messy, and impossible to fake. That background still shapes how I think: systems are only good if people can actually operate them when something goes wrong.",
                        "Over time I moved from keeping endpoints and users functioning, to owning infrastructure, and then to reliability work closer to delivery pipelines, cloud platforms, and operational guardrails. The through-line has stayed the same: remove friction, reduce avoidable failure, and leave systems easier to understand than I found them."
                    ],
                    chapters: [
                        {
                            title: "Started where failure is visible",
                            text: "My first roles were support-heavy. That taught me patience, direct communication, and a practical respect for operations."
                        },
                        {
                            title: "Moved into infrastructure ownership",
                            text: "At Optym and Jumio, the work became broader: provisioning, hybrid environments, automation, delivery tooling, DNS, identity, and day-2 operations."
                        },
                        {
                            title: "Now I optimize change and reliability",
                            text: "In reliability engineering, the interesting problems are rarely isolated. They sit between teams, pipelines, infrastructure, and incident handling."
                        }
                    ]
                },
                competencies: [
                    "Cloud: Azure (primary), AWS (some), Hybrid cloud, VMware vSphere",
                    "Containers: Kubernetes, Docker, Rancher, Harbor",
                    "Automation: Terraform, Ansible, PowerShell, Bash",
                    "CI/CD: GitHub Actions, Octopus Deploy, TeamCity, Jenkins",
                    "Web / routing: NGINX, HAProxy, IIS, Cloudflare, Azure LB",
                    "Identity: Azure AD, Active Directory, Keycloak",
                    "Monitoring: LogicMonitor, PRTG, Azure Monitor",
                    "Databases: SQL Server, PostgreSQL, Azure SQL, MongoDB",
                    "Version control: GitHub, Bitbucket"
                ]
            },
            experience: [
                {
                    title: "Reliability Engineer — Amadeus Labs",
                    dates: "Feb 2024 - Present",
                    highlights: [
                        "Migrated QA pipelines from Jenkins to GitHub Actions, reducing pipeline maintenance overhead and aligning with team-owned workflows already in GitHub.",
                        "Supported reliability and delivery operations for distributed systems serving Saudia, Southwest, and NEOM — environments where safe change and operational discipline are non-negotiable.",
                        "Maintained and improved CI/CD processes for large-scale travel infrastructure, coordinating across teams to reduce deployment friction.",
                        "Worked on monitoring, alerting, and observability improvements to catch issues earlier in the delivery cycle.",
                        "Handled incident response and post-incident reviews with a focus on systemic fixes over repeated workarounds."
                    ]
                },
                {
                    title: "Infrastructure Engineer — Jumio",
                    dates: "Jul 2022 - Feb 2024",
                    highlights: [
                        "Consolidated fragmented Azure subscriptions and cleaned up orphaned resources, reducing cloud spend by approximately $60k per year.",
                        "Deployed Azure AD Connect Sync to bridge on-prem Active Directory with Azure AD, enabling consistent identity across hybrid environments.",
                        "Rolled out LogicMonitor for unified observability across on-prem and Azure infrastructure, replacing blind spots with structured alerting.",
                        "Managed Cloudflare DNS migration with zero public IP exposure, using Cloudflare tunnels to eliminate inbound firewall rules.",
                        "Provisioned and maintained infrastructure for SUSE Rancher-based Kubernetes platform, including Harbor container registry."
                    ]
                },
                {
                    title: "System Administrator -> Senior System Administrator — Optym",
                    dates: "Aug 2017 - Jul 2022",
                    highlights: [
                        "Built Terraform and Ansible automation for VM provisioning and configuration management across VMware vSphere, reducing setup time and manual drift.",
                        "Managed production, UAT, and development infrastructure across Azure and on-prem VMware environments.",
                        "Migrated datacenter workloads and expanded IaaS footprint as the organization moved workloads off legacy hardware.",
                        "Administered Octopus Deploy and TeamCity for application delivery, managing deployment pipelines for internal products.",
                        "Maintained HAProxy, NGINX, and IIS load balancing and web serving across environments; managed SSL certificates and DNS."
                    ]
                },
                {
                    title: "IT Support Engineer — Tech Mahindra",
                    dates: "Sep 2016 - Aug 2017",
                    highlights: [
                        "Handled support incidents, hardware issues, and day-to-day user requests in a high-volume enterprise environment.",
                        "Troubleshot Windows workstations, printers, network access, and application issues under SLA pressure.",
                        "Developed communication habits and operational instincts that continue to inform incident handling today."
                    ]
                }
            ],
            projects: [
                {
                    title: "Enterprise infrastructure automation and datacenter migration",
                    description: "Built VM provisioning and configuration automation using Terraform and Ansible across VMware vSphere, reducing manual effort and supporting datacenter migration to modern IaaS.",
                    stack: ["Terraform", "Ansible", "vSphere", "PowerShell"],
                    linkLabel: "View repository",
                    linkHref: "https://github.com/hi-Das"
                },
                {
                    title: "CD pipeline optimization and Jenkins to GitHub Actions migration",
                    description: "Migrated QA pipelines from Jenkins to GitHub Actions and improved release flow ownership across teams and environments.",
                    stack: ["Octopus Deploy", "GitHub Actions", "CI/CD"],
                    linkLabel: "View repository",
                    linkHref: "https://github.com/hi-Das"
                },
                {
                    title: "Azure tenant consolidation saving ~$60k/year",
                    description: "Audited fragmented Azure subscriptions, removed orphaned resources, and consolidated environments to reduce annual cloud costs and improve manageability.",
                    stack: ["Azure", "CSP", "Tenant Management"],
                    linkLabel: "View repository",
                    linkHref: "https://github.com/hi-Das"
                },
                {
                    title: "Self-hosted Kubernetes platform with Rancher",
                    description: "Provisioned and maintained a self-hosted Kubernetes platform with SUSE Rancher and Harbor for private, controlled image distribution.",
                    stack: ["SUSE Rancher", "Kubernetes", "Harbor"],
                    linkLabel: "View repository",
                    linkHref: "https://github.com/hi-Das"
                },
                {
                    title: "DNS migration to Cloudflare with zero public IP exposure",
                    description: "Migrated DNS to Cloudflare and adopted tunnels to terminate inbound connectivity without exposing public IPs or opening inbound firewall rules.",
                    stack: ["Cloudflare", "DNS", "WAF", "Tunnels"],
                    linkLabel: "View repository",
                    linkHref: "https://github.com/hi-Das"
                }
            ]
        };

        const tabs = [
            { key: "about", label: "About" },
            { key: "experience", label: "Experience" },
            { key: "projects", label: "Projects" }
        ];

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function renderHeader(data) {
            const tabButtons = tabs
                .map((tab, index) => `
                    <button
                        class="tab ${index === 0 ? "is-active" : ""}"
                        role="tab"
                        aria-selected="${index === 0 ? "true" : "false"}"
                        aria-controls="panel-${tab.key}"
                        id="tab-${tab.key}"
                        data-tab="${tab.key}"
                        type="button"
                    >${tab.label}</button>
                `)
                .join("");

            return `
                <header class="header">
                    <div class="identity">
                        <h1 class="name">${escapeHtml(data.profile.name)}</h1>
                        <p class="focus">${escapeHtml(data.profile.focus)}</p>
                    </div>
                    <nav class="tabs" role="tablist" aria-label="Portfolio sections">
                        ${tabButtons}
                    </nav>
                </header>
            `;
        }

        function renderAbout(data) {
            const competencyBadges = data.about.competencies
                .map((item) => `<li class="badge">${escapeHtml(item)}</li>`)
                .join("");

            const storyParagraphs = (data.about.story?.paragraphs || [])
                .map((text) => `<p class="story-paragraph">${escapeHtml(text)}</p>`)
                .join("");

            const storyChapters = (data.about.story?.chapters || [])
                .map((chapter, index) => `
                    <li>
                        <p class="story-step-title">${index + 1}. ${escapeHtml(chapter.title)}</p>
                        <p class="story-step-text">${escapeHtml(chapter.text)}</p>
                    </li>
                `)
                .join("");

            const storySection = data.about.story
                ? `
                    <section class="story" aria-label="Story">
                        <p class="story-title">Story</p>
                        ${storyParagraphs}
                        <ol class="story-steps">${storyChapters}</ol>
                    </section>
                `
                : "";

            return `
                <section class="tab-panel is-active" id="panel-about" role="tabpanel" aria-labelledby="tab-about">
                    <h2 class="panel-title">🧭 About</h2>
                    <p class="intro">${escapeHtml(data.about.intro)}</p>
                    ${storySection}
                    <section class="callout" aria-label="Core competencies">
                        <div class="callout-emoji" aria-hidden="true">⚙️</div>
                        <div>
                            <p class="callout-title">Core Competencies</p>
                            <ul class="badge-list">${competencyBadges}</ul>
                        </div>
                    </section>
                </section>
            `;
        }

        function renderExperience(data) {
            const roles = data.experience
                .map((role) => {
                    const bullets = role.highlights
                        .map((point) => `<li>${escapeHtml(point)}</li>`)
                        .join("");

                    return `
                        <article class="role">
                            <div class="role-head">
                                <h3 class="role-title">${escapeHtml(role.title)}</h3>
                                <span class="role-dates">${escapeHtml(role.dates)}</span>
                            </div>
                            <ul class="role-bullets">${bullets}</ul>
                        </article>
                    `;
                })
                .join("");

            return `
                <section class="tab-panel" id="panel-experience" role="tabpanel" aria-labelledby="tab-experience">
                    <h2 class="panel-title">🗂️ Experience</h2>
                    <div class="timeline">${roles}</div>
                </section>
            `;
        }

        function renderProjects(data) {
            const projectItems = data.projects
                .map((project) => {
                    const stackBadges = project.stack
                        .map((item) => `<span class="badge">${escapeHtml(item)}</span>`)
                        .join("");

                    return `
                    <article class="project">
                        <h3 class="project-title">${escapeHtml(project.title)}</h3>
                        <p class="project-desc">${escapeHtml(project.description)}</p>
                        <div class="project-stack">${stackBadges}</div>
                        <a class="project-link" href="${escapeHtml(project.linkHref)}" target="_blank" rel="noreferrer">${escapeHtml(project.linkLabel)}</a>
                    </article>
                `;
                })
                .join("");

            return `
                <section class="tab-panel" id="panel-projects" role="tabpanel" aria-labelledby="tab-projects">
                    <h2 class="panel-title">🧩 Projects</h2>
                    <div class="projects">${projectItems}</div>
                </section>
            `;
        }

        function renderPage(data) {
            const root = document.getElementById("app");
            root.innerHTML = `
                ${renderHeader(data)}
                <section class="content">
                    ${renderAbout(data)}
                    ${renderExperience(data)}
                    ${renderProjects(data)}
                </section>
            `;
        }

        function setupTabs() {
            const tabButtons = Array.from(document.querySelectorAll(".tab"));
            const panels = Array.from(document.querySelectorAll(".tab-panel"));

            function activateTab(tabKey) {
                tabButtons.forEach((button) => {
                    const isActive = button.dataset.tab === tabKey;
                    button.classList.toggle("is-active", isActive);
                    button.setAttribute("aria-selected", isActive ? "true" : "false");
                });

                panels.forEach((panel) => {
                    const isActive = panel.id === `panel-${tabKey}`;
                    panel.classList.toggle("is-active", isActive);
                });
            }

            tabButtons.forEach((button) => {
                button.addEventListener("click", () => activateTab(button.dataset.tab));
            });
        }

        renderPage(portfolioData);
        setupTabs();
    </script>
</body>
</html>
